# Postgres for the full-stack Studio e2e run (make studio-e2e-up). Data lives on tmpfs, so every up starts from a fresh seed.
name: prest-studio-e2e

services:
  db:
    image: postgres:18
    ports:
      - '127.0.0.1:${STUDIO_E2E_PG_PORT:-55432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prest
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./fixtures/initdb:/docker-entrypoint-initdb.d:ro
      - ./fixtures/seed.sql:/seed/seed.sql:ro
      - ./fixtures/seed-auth.sql:/seed/seed-auth.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d prest_auth']
      interval: 2s
      timeout: 3s
      retries: 30
