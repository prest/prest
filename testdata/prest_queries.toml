[auth]
enabled = true
migrate_on_startup = true
schema = "public"
table = "prest_users"
username = "username"
password = "password"
encrypt = "md5"
type = "body"

[jwt]
key = "integration-test-secret-key-32b!!"
algo = "HS256"
whitelist = ["^\\/auth$"]

[http]
port = 3003

[access]
restrict = false

[queries]
storage = "database"
migrate_on_startup = true
import_on_startup = true
import_policy = "update"
register_enabled = true
register_admins = ["test@postgres.rest"]
restrict = true

[[queries.scripts]]
location = "fulltable"
name = "get_all"
permissions = ["read"]

[[queries.scripts]]
location = "itest"
name = "ephemeral"
permissions = ["read"]

# Templates registered at runtime by the script-parameter tests
# (integration/postgres/controllers/queries_database_params_test.go). They verify
# that the parameter screen and the sqlVal binding helpers behave identically when
# a template lives in prest_queries instead of on disk. Grants are per
# location+name, so each needs an entry.
[[queries.scripts]]
location = "itest"
name = "screened"
permissions = ["read"]

[[queries.scripts]]
location = "itest"
name = "bound"
permissions = ["read"]

[[queries.scripts]]
location = "itest"
name = "rawreach"
permissions = ["read"]

[[queries.users]]
name = "test@postgres.rest"
  [[queries.users.scripts]]
  location = "fulltable"
  name = "get_all"
  permissions = ["read"]
  [[queries.users.scripts]]
  location = "itest"
  name = "ephemeral"
  permissions = ["read"]
  [[queries.users.scripts]]
  location = "itest"
  name = "screened"
  permissions = ["read"]
  [[queries.users.scripts]]
  location = "itest"
  name = "bound"
  permissions = ["read"]
  [[queries.users.scripts]]
  location = "itest"
  name = "rawreach"
  permissions = ["read"]
