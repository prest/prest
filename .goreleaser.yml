version: 2

before:
  hooks:
    # The plugin image ships vendor/ so entrypoint plugin builds match prestd.
    - go mod vendor

builds:
  - id: prestd
    binary: prestd
    main: ./cmd/prestd/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -X github.com/prest/prest/v2/helpers.Version={{.Version}} -X github.com/prest/prest/v2/helpers.Commit={{.Commit}} -X github.com/prest/prest/v2/helpers.Date={{ .CommitDate }} -X github.com/prest/prest/v2/helpers.BuiltBy=goreleaser
    goos:
      - windows
      - darwin
      - linux
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - mips
      - mips64
      - mipsle
      - mips64le
      - ppc64
      - ppc64le
      - s390x
    goarm:
      - 5
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm

  # Image binary. Go plugins need cgo and the same flags as etc/plugin/go-build.sh
  # (-mod=vendor -trimpath -s -w), or plugin.Open rejects the .so.
  - id: prestd-docker
    binary: prestd
    main: ./cmd/prestd/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -mod=vendor
      - -trimpath
    ldflags:
      - -s -w -X github.com/prest/prest/v2/helpers.Version={{.Version}} -X github.com/prest/prest/v2/helpers.Commit={{.Commit}} -X github.com/prest/prest/v2/helpers.Date={{ .CommitDate }} -X github.com/prest/prest/v2/helpers.BuiltBy=goreleaser
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
archives:
  # Release archives keep the portable build; prestd-docker only feeds images.
  - ids: [prestd]

checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'
changelog:
  sort: asc
  use: github
  filters:
    exclude:
    - '^test:'
    - (?i)typo
    - Merge pull request
    - Merge branch
    - go mod tidy
release:
  github:
    owner: prest
    name: prest

dockers_v2:
  - id: prest
    ids: [prestd-docker]
    dockerfile: Dockerfile
    images:
      - prest/prest
      - ghcr.io/prest/prest
    tags:
      - '{{ .Tag }}'
      - 'v{{ .Major }}'
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - etc/entrypoint.sh
      - lib
      - etc/plugin
      - go.mod
      - go.sum
      - vendor
    flags:
      - --target=release
    build_args:
      # Must equal the toolchain that built prestd-docker (CI exports it).
      GO_VERSION: '{{ envOrDefault "GO_VERSION" "1.26" }}'
    labels:
      org.opencontainers.image.created: '{{ .Date }}'
      org.opencontainers.image.name: '{{ .ProjectName }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.version: '{{ .Version }}'

  - id: prest-noplugins
    ids: [prestd-docker]
    dockerfile: Dockerfile.noplugins
    images:
      - prest/prest
      - ghcr.io/prest/prest
    tags:
      - '{{ .Tag }}-noplugins'
      - 'v{{ .Major }}-noplugins'
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - etc/entrypoint.sh
      - lib
      - etc/plugin
    flags:
      - --target=release
    labels:
      org.opencontainers.image.created: '{{ .Date }}'
      org.opencontainers.image.name: '{{ .ProjectName }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.version: '{{ .Version }}'
