name: test-integration-mysql
run-name: MySQL integration tests

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:

jobs:
  integration-mysql:
    name: integration-mysql (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - mysql:8.0
          - mysql:8.4
          - mysql:26.7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run MySQL E2E integration tests via docker compose
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
        run: make test-integration-mysql
