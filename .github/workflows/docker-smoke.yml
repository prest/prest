name: docker plugin smoke
run-name: release image builds and loads plugins

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.noplugins
      - .goreleaser.yml
      - etc/**
      - lib/**
      - go.mod
      - go.sum
      - scripts/docker-plugin-smoke.sh
      - .github/workflows/docker-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Export Go version for the image
        run: echo "GO_VERSION=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install arm64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      # Same build as the release images (cgo, -mod=vendor, -trimpath).
      - name: Build image binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean --id prestd-docker

      - name: Smoke linux/amd64
        run: bash scripts/docker-plugin-smoke.sh amd64 "$(find dist -path '*prestd-docker_linux_amd64*' -name prestd -type f)"

      - name: Smoke linux/arm64 (QEMU)
        run: bash scripts/docker-plugin-smoke.sh arm64 "$(find dist -path '*prestd-docker_linux_arm64*' -name prestd -type f)"
